# Example Prometheus scrape config for the SIEM engine.
# Run a local Prometheus with:  prometheus --config.file=prometheus.example.yml
global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  # API process — HTTP request counters, etc.
  - job_name: siem-api
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8000"]

  # Stream processor — pipeline/detection counters and latency histograms.
  - job_name: siem-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9109"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["localhost:9644"]
