[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-engine-backend"
version = "0.1.0"
description = "Real-Time Distributed Enterprise SIEM Engine — ingestion, streaming, detection, API"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Veer Shah" }]

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sse-starlette==2.1.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "redis==5.2.1",
    "aiokafka==0.12.0",
    "structlog==24.4.0",
    "orjson==3.10.12",
    "python-multipart==0.0.20",
    "prometheus-client==0.21.1",
    "passlib[bcrypt]==1.7.4",
    "pyjwt==2.10.1",
    "httpx==0.28.1",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
ml = ["scikit-learn==1.6.0", "numpy==2.2.1"]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "coverage==7.6.9",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "bandit==1.8.0",
    "pip-audit==2.7.3",
    "asgi-lifespan==2.1.0",
    "types-passlib",
    "fakeredis==2.26.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",     # asserts (tests)
    "B008",     # FastAPI Depends() in defaults
    "E501",     # line length is enforced by `ruff format`, not the linter
    "RUF001",   # ambiguous unicode in strings (σ etc. are intentional in analyst-facing text)
    "RUF002",
    "RUF003",
    "RUF012",   # class-level default containers are deliberate on Detector subclasses
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "B017", "B018"]
"alembic/**" = ["ALL"]
"app/api/routes/auth.py" = ["S105"]  # "bearer" token_type literal, not a secret

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

# redis-py's async client types several commands as `Awaitable[T] | T`, so
# `await client.hget(...)` trips `misc` in strict await checking. The awaits are
# correct at runtime; scope the suppression to the modules that touch Redis hashes.
[[tool.mypy.overrides]]
module = [
    "app.services.metrics_service",
    "app.streaming.pipeline",
    "app.api.routes.system",
    "app.api.routes.realtime",
]
disable_error_code = ["misc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires Postgres/Kafka (set SIEM_RUN_INTEGRATION=1)"]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/worker.py", "alembic/*", "app/core/logging.py"]

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
# B101: asserts are used only for type-narrowing after an `applies_to()` guard.
skips = ["B101"]
