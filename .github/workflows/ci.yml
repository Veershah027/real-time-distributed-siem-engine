name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  backend-quality:
    name: Backend · lint · types · security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .
      - name: mypy
        run: mypy app
      - name: Bandit
        run: bandit -c pyproject.toml -r app -q
      - name: pip-audit
        run: pip-audit --progress-spinner off || true  # advisory: never blocks on upstream CVEs

  backend-tests:
    name: Backend · unit + integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: siem
          POSTGRES_PASSWORD: siem
          POSTGRES_DB: siem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U siem" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      SIEM_RUN_INTEGRATION: "1"
      POSTGRES_HOST: localhost
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem
      POSTGRES_DB: siem
      REDIS_HOST: localhost
      SIEM_KAFKA_BOOTSTRAP_SERVERS: localhost:19092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Alembic migrations apply cleanly
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: pytest + coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=75
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  simulator:
    name: Simulator · lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend · lint · types · build · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [backend-quality, simulator, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build simulator image
        uses: docker/build-push-action@v6
        with:
          context: ./simulator
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    name: Compose · end-to-end smoke
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Boot the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for API health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health; then echo; break; fi
            sleep 3
          done
          curl -fsS http://localhost:8000/health/ready | tee /tmp/ready.json
      - name: Drive a brute-force detection
        run: |
          docker compose run --rm simulator --once ssh_brute_force
          docker compose run --rm simulator --once port_scan
          sleep 12
          echo "alerts:"
          curl -fsS "http://localhost:8000/api/alerts?limit=20" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['total'],'alerts');assert d['total']>=1, 'expected >=1 alert'"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 120
      - name: Tear down
        if: always()
        run: docker compose down -v
